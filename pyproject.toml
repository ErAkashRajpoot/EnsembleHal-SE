[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emhd"
version = "0.1.0"
description = "Ensemble meta-learning for hallucination detection in LLM-generated software artefacts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp==3.10.5",
  "bert-score==0.3.13",
  "datasets==2.21.0",
  "evaluate==0.4.3",
  "joblib==1.4.2",
  "jsonschema==4.23.0",
  "javalang==0.13.0",
  "lightgbm==4.5.0",
  "matplotlib==3.9.0",
  "numpy==1.26.4",
  "optuna==3.6.1",
  "pandas==2.2.2",
  "python-dotenv==1.0.1",
  "pyyaml==6.0.2",
  "rouge-score==0.1.2",
  "scikit-learn==1.5.1",
  "seaborn==0.13.2",
  "sentence-transformers==3.0.1",
  "shap==0.46.0",
  "tenacity==9.0.0",
  "torch==2.3.0",
  "tqdm==4.66.5",
  "transformers==4.44.2",
  "tree-sitter==0.23.0",
  "tree-sitter-java==0.23.0",
  "tree-sitter-python==0.23.0",
  "xgboost==2.1.1"
]

[tool.setuptools.packages.find]
where = ["src"]
